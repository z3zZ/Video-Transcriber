[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcriber"
dynamic = ["version"]
description = "Turn videos into text transcripts locally with Whisper. Web app + CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "faster-whisper>=1.1",
  "av>=15,<19",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
video-transcriber = "transcriber.__main__:main"

[tool.setuptools]
packages = ["transcriber"]

[tool.setuptools.package-data]
transcriber = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "transcriber.__version__" }
